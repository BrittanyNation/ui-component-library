<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Component Library — Showcase</title><link rel="stylesheet" href="components.css"></head>
<body>
<main class="wrap">
<h1>Component Library</h1>

<section><h2>Buttons</h2>
<button class="btn">Default</button>
<button class="btn btn-primary">Primary</button>
<button class="btn" disabled>Disabled</button>
</section>

<section><h2>Modal</h2>
<button class="btn btn-primary" data-open-modal>Open modal</button>
<div class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title">Delete this item?</h3>
    <p>This action cannot be undone.</p>
    <button class="btn" data-close-modal>Cancel</button>
    <button class="btn btn-danger" data-close-modal>Delete</button>
  </div>
</div>
</section>

<section><h2>Tabs</h2>
<div role="tablist" aria-label="Sample tabs">
  <button role="tab" aria-selected="true" data-tab="0">Overview</button>
  <button role="tab" aria-selected="false" data-tab="1">Details</button>
  <button role="tab" aria-selected="false" data-tab="2">Reviews</button>
</div>
<div role="tabpanel" data-panel="0">Overview panel content.</div>
<div role="tabpanel" data-panel="1" hidden>Details panel content.</div>
<div role="tabpanel" data-panel="2" hidden>Reviews panel content.</div>
</section>

<section><h2>Accordion</h2>
<div class="accordion-item">
  <button class="accordion-btn" aria-expanded="false">Shipping information</button>
  <div class="accordion-panel" hidden><p>Orders ship within two business days.</p></div>
</div>
<div class="accordion-item">
  <button class="accordion-btn" aria-expanded="false">Returns</button>
  <div class="accordion-panel" hidden><p>Returns are accepted within 30 days.</p></div>
</div>
</section>
</main>
<script src="components.js"></script>
</body></html>
